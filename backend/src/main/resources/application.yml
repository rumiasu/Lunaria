server:
  address: 127.0.0.1
  port: 18081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
lunaria:
  membership:
    # Unconfirmed policy: record fulfillment separately without automatic tier changes.
    # DEMO_FULFILLED_VALUE is an explicit development-only illustration, never a production promise.
    mode: TRACK_ONLY
spring:
  application:
    name: lunaria
  datasource:
    url: jdbc:h2:file:./data/lunaria-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      accept-float-as-int: false
  h2:
    console:
      enabled: false
  web:
    error:
      include-message: never
