plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'cn.lunaria'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencyLocking { lockAllConfigurations() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.github.wechatpay-apiv3:wechatpay-java:0.2.17'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-parameters' }
tasks.named('test') {
    useJUnitPlatform { excludeTags 'mysql' }
    inputs.files(fileTree('sql/mysql/migrations') { include '*.sql' }, file('sql/schema.mysql.sql'))
        .withPropertyName('mysqlMigrationScripts')
}

tasks.register('mysqlTest', Test) {
    description = 'Run targeted engine/transaction checks against an explicitly isolated temporary MySQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    inputs.files(fileTree('sql/mysql/migrations') { include '*.sql' }, file('sql/schema.mysql.sql'))
    outputs.upToDateWhen { false }
    doFirst {
        if (System.getenv('LUNARIA_MYSQL_TEST_ISOLATED') != 'true') {
            throw new GradleException('Use scripts/test-mysql-isolated.ps1 or an isolated CI MySQL service; never a business database.')
        }
    }
}
tasks.named('bootJar') { archiveFileName = 'lunaria-dev.jar' }
